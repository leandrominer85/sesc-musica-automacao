{
  "name": "\ud83c\udfb5 Sesc SP \u2013 Programa\u00e7\u00e3o Musical Mensal",
  "true": {
    "schedule": [
      {
        "cron": "0 12 25 * *"
      }
    ],
    "workflow_dispatch": {
      "inputs": {
        "forcar_envio": {
          "description": "Enviar e-mail mesmo sem mudan\u00e7as?",
          "required": false,
          "default": "false",
          "type": "choice",
          "options": [
            "false",
            "true"
          ]
        }
      }
    }
  },
  "jobs": {
    "extrair-e-notificar": {
      "name": "Extrair programa\u00e7\u00e3o e notificar",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "permissions": {
        "contents": "write"
      },
      "steps": [
        {
          "name": "\ud83d\udce5 Checkout do reposit\u00f3rio",
          "uses": "actions/checkout@v4",
          "with": {
            "token": "${{ secrets.GITHUB_TOKEN }}"
          }
        },
        {
          "name": "\ud83d\udc0d Configurar Python 3.11",
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11",
            "cache": "pip"
          }
        },
        {
          "name": "\ud83d\udce6 Instalar depend\u00eancias",
          "run": "pip install --upgrade pip\npip install requests pypdf openpyxl\n"
        },
        {
          "name": "\ud83c\udfb5 Extrair programa\u00e7\u00e3o musical",
          "run": "cd ${{ github.workspace }}\npython scripts/sesc_musica_capital.py\n",
          "env": {
            "PYTHONUNBUFFERED": "1"
          }
        },
        {
          "name": "\ud83d\udccb Verificar arquivo gerado",
          "run": "echo \"Arquivos gerados:\"\nls -lh *.xlsx 2>/dev/null || echo \"(nenhum .xlsx na raiz)\"\nls -lh scripts/*.xlsx 2>/dev/null || echo \"(nenhum .xlsx em scripts/)\"\n"
        },
        {
          "name": "\ud83d\udcc2 Organizar arquivo Excel",
          "run": "# Move qualquer xlsx gerado para a raiz do reposit\u00f3rio\nfind . -maxdepth 2 -name \"sesc_musica_capital_*.xlsx\" \\\n  ! -path \"./historico/*\" \\\n  -exec mv {} . \\; 2>/dev/null || true\n"
        },
        {
          "name": "\ud83d\udcec Comparar mudan\u00e7as e notificar",
          "run": "cd ${{ github.workspace }}\npython scripts/comparar_e_notificar.py\n",
          "env": {
            "GMAIL_USER": "${{ secrets.GMAIL_USER }}",
            "GMAIL_APP_PASS": "${{ secrets.GMAIL_APP_PASS }}",
            "EMAIL_DESTINO": "${{ secrets.EMAIL_DESTINO }}",
            "FORCAR_ENVIO": "${{ github.event.inputs.forcar_envio || 'false' }}"
          }
        },
        {
          "name": "\ud83d\udcbe Salvar hist\u00f3rico no reposit\u00f3rio",
          "run": "git config user.name  \"github-actions[bot]\"\ngit config user.email \"github-actions[bot]@users.noreply.github.com\"\n\ngit add ultimo_hash.json historico/ *.xlsx 2>/dev/null || true\n\n# S\u00f3 faz commit se houver mudan\u00e7as\nif git diff --staged --quiet; then\n  echo \"Nada novo para commitar.\"\nelse\n  DATA=$(date '+%Y-%m-%d %H:%M')\n  git commit -m \"\ud83c\udfb5 Programa\u00e7\u00e3o musical atualizada \u2013 $DATA\"\n  git push\nfi\n"
        }
      ]
    }
  }
}
