name: 🎵 Sesc SP – Programação Musical Mensal

# ──────────────────────────────────────────────────────────────
# QUANDO EXECUTAR
# ──────────────────────────────────────────────────────────────
on:
  # Gatilho temporário para forçar o GitHub a registrar o workflow na aba Actions
  push:
    branches: [ "main" ]

  # Automático: todo dia 25 do mês às 9h (horário de Brasília = 12h UTC)
  schedule:
    - cron: "0 12 25 * *"

  # Manual: permite rodar a qualquer momento pelo painel do GitHub
  workflow_dispatch:
    inputs:
      forcar_envio:
        description: "Enviar e-mail mesmo sem mudanças?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# ──────────────────────────────────────────────────────────────
# JOBS
# ──────────────────────────────────────────────────────────────
jobs:
  extrair-e-notificar:
    name: Extrair programação e notificar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write   # para fazer commit do hash e histórico

    steps:

      # 1. Baixa o código do repositório
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Configura Python
      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
         

      # 3. Instala dependências
      - name: 📦 Instalar dependências
        run: |
          pip install --upgrade pip
          pip install requests pypdf openpyxl

      # 4. Roda o extrator principal
      - name: 🎵 Extrair programação musical
        run: |
          cd ${{ github.workspace }}
          python scripts/sesc_musica_capital.py
        env:
          # Garante que o script não peça input manual
          PYTHONUNBUFFERED: "1"

      # 5. Lista o arquivo gerado (debug)
      - name: 📋 Verificar arquivo gerado
        run: |
          echo "Arquivos gerados:"
          ls -lh *.xlsx 2>/dev/null || echo "(nenhum .xlsx na raiz)"
          ls -lh scripts/*.xlsx 2>/dev/null || echo "(nenhum .xlsx em scripts/)"

      # 6. Move o xlsx para a raiz do projeto (se gerado em scripts/)
      - name: 📂 Organizar arquivo Excel
        run: |
          # Move qualquer xlsx gerado para a raiz do repositório
          find . -maxdepth 2 -name "sesc_musica_capital_*.xlsx" \
            ! -path "./historico/*" \
            -exec mv {} . \; 2>/dev/null || true

      # 7. Compara com versão anterior e envia e-mail
      - name: 📬 Comparar mudanças e notificar
        run: |
          cd ${{ github.workspace }}
          python scripts/comparar_e_notificar.py
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          EMAIL_DESTINO:  ${{ secrets.EMAIL_DESTINO }}
          FORCAR_ENVIO:   ${{ github.event.inputs.forcar_envio || 'false' }}

      # 8. Faz commit do hash e histórico de volta ao repositório
      - name: 💾 Salvar histórico no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply
