name: Sesc SP - Programacao Musical Mensal

on:
  schedule:
    # Todo dia 25 do mês às 9h (horário de Brasília = 12h UTC)
    - cron: "0 12 30 * *"

  # Permite rodar manualmente pelo painel do GitHub
  workflow_dispatch:
    inputs:
      forcar_envio:
        description: "Enviar e-mail mesmo sem mudanças?"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  extrair-e-notificar:
    name: Extrair programação e notificar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:

      - name: Checkout do repositorio
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install requests pdfplumber openpyxl

      - name: Executar extração da programação musical
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py
      
      - name: Extrair programacao musical
        id: extrair
        run: |
          cd ${{ github.workspace }}
          python scripts/sesc_musica_capital.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Verificar arquivo gerado
        run: |
          echo "=== Arquivos xlsx gerados ==="
          find . -name "sesc_musica_capital_*.xlsx" ! -path "./historico/*" | sort
          echo "=== Fim ==="

      - name: Organizar arquivo Excel
        run: |
          find . -maxdepth 3 -name "sesc_musica_capital_*.xlsx" \
            ! -path "./historico/*" \
            -exec mv {} . \; 2>/dev/null || true

      - name: Comparar mudancas e notificar
        run: |
          cd ${{ github.workspace }}
          python scripts/comparar_e_notificar.py
        env:
          GMAIL_USER:     ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          EMAIL_DESTINO:  ${{ secrets.EMAIL_DESTINO }}
          FORCAR_ENVIO:   ${{ github.event.inputs.forcar_envio || 'false' }}

      - name: Salvar historico no repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ultimo_hash.json historico/ sesc_musica_capital_*.xlsx 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Nada novo para commitar."
          else
            DATA=$(date '+%Y-%m-%d %H:%M')
            git commit -m "Programacao musical atualizada - $DATA"
            git push
          fi
